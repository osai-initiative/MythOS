name: Publish signed MythOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Debian version to publish
        required: true
        type: string
      channel:
        description: Release track
        required: true
        default: rolling
        type: choice
        options: [stable, rolling]
      tag:
        description: Immutable Git tag for this release
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rolling
      - name: Import protected release key
        env:
          RELEASE_KEY: ${{ secrets.MYTHOS_RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEY" | gpg --batch --import
      - name: Build and sign release
        env:
          MYTHOS_RELEASE_CHANNEL: ${{ inputs.channel }}
          MYTHOS_RELEASE_VERSION: ${{ inputs.version }}
          MYTHOS_RELEASE_TAG: ${{ inputs.tag }}
          MYTHOS_RELEASE_SIGNING_KEY: 5B32D10C7AFD29113A8023E4FA97765702948BA8
          MYTHOS_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.MYTHOS_RELEASE_SIGNING_PASSPHRASE }}
        run: make release-update
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=--latest
          if [[ "${{ inputs.channel }}" == rolling ]]; then flag=--prerelease; fi
          gh release create "${{ inputs.tag }}" .build/artifacts/mythos-${{ inputs.version }}-${{ inputs.channel }}-update/* .build/artifacts/mythos-${{ inputs.version }}-${{ inputs.channel }}-update.tar.gz --title "MythOS ${{ inputs.version }}" "$flag"
