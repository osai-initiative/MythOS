[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumeros"
version = "1.0.0"
description = "Consumer-facing control and recovery plane for ConsumerOS"
requires-python = ">=3.11"

[project.scripts]
consumeros = "consumeros.gui:main"
consumeros-drivers = "consumeros.gui:drivers_main"
consumeros-recovery = "consumeros.gui:recovery_main"
consumerosctl = "consumeros.cli:main"
consumeros-welcome = "consumeros.welcome:main"
consumeros-migrate = "consumeros.migrate_gui:main"
consumeros-open = "consumeros.open_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["consumeros"]
